schema_version: 1

context:
  version: "0.10.2"

package:
  name: colima
  version: ${{ version }}

source:
  url: https://github.com/abiosoft/colima/archive/v${{ version }}.tar.gz
  sha256: 595f4ed25316f7de2896939bfd78cf419b13807c05705e7ba658fbcc7eaf60bf

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses
  run:
    - lima-vm

tests:
  - script:
      - colima --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Container runtimes on MacOS (and Linux) with minimal setup
  homepage: https://github.com/abiosoft/colima
  repository: https://github.com/abiosoft/colima

extra:
  recipe-maintainers:
    - danielnachun
